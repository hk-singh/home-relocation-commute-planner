name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One-time setup: Settings -> Pages -> Build and deployment -> Source:
      # "GitHub Actions". The workflow token cannot switch this on itself
      # (Create Pages site returns "Resource not accessible by integration"),
      # so it has to be done once by hand. Every push after that deploys.
      - uses: actions/configure-pages@v5
      - name: Package the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
